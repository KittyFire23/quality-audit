<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Auditorías AR</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:700px;
    margin:auto;
}

button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    margin-top:10px;
}

select,
textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="card">

<h1>Auditorías AR</h1>

<label>Auditor</label>

<select>
<option>Diego Nuñez</option>
<option>Sandra Lareu</option>
<option>Nicolas Llacomotti</option>
</select>

<label>Sector</label>

<select>
<option>Armado de Válvulas</option>
<option>Prearmado</option>
<option>Inyección 1</option>
<option>Inyección 2</option>
<option>Armado de Kosmos</option>
<option>Armado de Pulsadores</option>
<option>Sleeve</option>
<option>Arandelado</option>
<option>Extrusión</option>
<option>Estampado</option>
</select>

<button onclick="comenzarAuditoria()">
Comenzar Auditoría
</button>

<div id="contenido"></div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = 'https://szjoqilrffchvqvjceym.supabase.co';

const supabaseKey = 'sb_publishable_XjenDjK3p7wXqlDqDVyERg_N7PeEdzF';

const supabase = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);
let preguntas = [];
`
let actual = 0;

async function comenzarAuditoria(){

const { data, error } = await supabase
.from('questions')
.select('*')
.order('position');

if(error){

alert('Error cargando preguntas');

console.log(error);

return;

}

preguntas = data;

actual = 0;

mostrarPregunta();

}

function mostrarPregunta(){

document.getElementById("contenido").innerHTML = `

<hr>

<h2>${preguntas[actual].section}</h2>

<p><b>Pregunta ${actual + 1} de ${preguntas.length}</b></p>

<p>${preguntas[actual].question}</p>

<label>
<input type="radio" name="respuesta">
Cumple
</label>

<br><br>

<label>
<input type="radio" name="respuesta">
No Cumple
</label>

<br><br>

<label>
<input type="radio" name="respuesta">
No Aplica
</label>

<br><br>

<textarea placeholder="Observaciones"></textarea>

<button onclick="siguientePregunta()">
Siguiente
</button>

`;

}

function siguientePregunta(){

actual++;

if(actual >= preguntas.length){

document.getElementById("contenido").innerHTML = `
<hr>
<h2>Auditoría Finalizada</h2>
<p>La prueba terminó correctamente.</p>
`;

return;

}

mostrarPregunta();

}

</script>

</body>
</html>
