<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Auditorías AR</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:700px;
    margin:auto;
}

button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    margin-top:10px;
}

select,
textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="card">

<h1>Auditorías AR</h1>

<label>Auditor</label>

<select>
<option>Diego Nuñez</option>
<option>Sandra Lareu</option>
<option>Nicolas Llacomotti</option>
</select>

<label>Sector</label>

<select>
<option>Armado de Válvulas</option>
<option>Prearmado</option>
<option>Inyección 1</option>
<option>Inyección 2</option>
<option>Armado de Kosmos</option>
<option>Armado de Pulsadores</option>
<option>Sleeve</option>
<option>Arandelado</option>
<option>Extrusión</option>
<option>Estampado</option>
</select>

<button onclick="comenzarAuditoria()">
Comenzar Auditoría
</button>

<div id="contenido"></div>

</div>

<script>

const preguntas = [

"¿Están las condiciones de seguridad contempladas? De no ser así exponerlas. Ej.: matafuegos de libre acceso, salida de emergencias libres, kits de mitigación disponibles, tableros eléctricos cerrados, cableado seguro, etc.",

"¿Están cerradas las puertas que dan al exterior? ¿De existir ventanas y abiertas, presentan mosquiteros en buen estado?",

"¿Se encuentran las paredes e instalaciones en general en estado adecuado de manera tal de evitar situaciones que puedan generar el anidamiento de plagas?",

"¿Están las zonas de tránsito libres de obstrucciones?",

"Respecto a los elementos vinculados a la limpieza: ¿están en un lugar designado? ¿Los recipientes de residuos se encuentran tapados y bien clasificados de acuerdo a cartelería?",

"¿Está el área productiva libre de vasos de café, alimentos y pertenencias personales?",

"Si existen productos químicos en el sector, ¿están correctamente identificados?",

"¿Se encuentra el botiquín con los elementos indicados?",

"¿Se evita la presencia de muebles y/o pallets deteriorados que puedan desprender astillas u otros elementos contaminantes?",

"En caso de uso de carros para actividades de mantenimiento, ¿los mismos se encuentran en estado adecuado? En caso de no aplicar colocar OK."

];
let actual = 0;

function comenzarAuditoria(){
    actual = 0;
    mostrarPregunta();
}

function mostrarPregunta(){

document.getElementById("contenido").innerHTML = `

<hr>

<h2>Pregunta ${actual + 1} de ${preguntas.length}</h2>

<p>${preguntas[actual]}</p>

<label>
<input type="radio" name="respuesta">
Cumple
</label>

<br><br>

<label>
<input type="radio" name="respuesta">
No Cumple
</label>

<br><br>

<label>
<input type="radio" name="respuesta">
No Aplica
</label>

<br><br>

<textarea placeholder="Observaciones"></textarea>

<button onclick="siguientePregunta()">
Siguiente
</button>

`;

}

function siguientePregunta(){

actual++;

if(actual >= preguntas.length){

document.getElementById("contenido").innerHTML = `
<hr>
<h2>Auditoría Finalizada</h2>
<p>La prueba terminó correctamente.</p>
`;

return;

}

mostrarPregunta();

}

</script>

</body>
</html>
