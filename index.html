<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Auditorías AR</title>

<style>
.kpi{

    background:white;
    border-radius:15px;
    padding:25px;
    margin-top:20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);

}

.kpi-numero{

    font-size:48px;
    font-weight:bold;
    color:#0d6efd;

}

.estado-verde{

    color:#198754;
    font-weight:bold;

}

.estado-amarillo{

    color:#ffc107;
    font-weight:bold;

}

.estado-rojo{

    color:#dc3545;
    font-weight:bold;

}

body{
    font-family: 'Segoe UI', sans-serif;
    background:#eef2f7;
    padding:20px;
    margin:0;
}


.card{
    background:white;
    padding:30px;
    border-radius:20px;
    max-width:900px;
    margin:auto;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
}

button{
    width:100%;
    padding:15px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    margin-top:10px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0b5ed7;
}

select,
textarea,
input[type=file]{
    width:100%;
    padding:10px;
    margin-top:10px;
}

h2{
    color:#0d6efd;
}
</style>

</head>
<body>

<div class="card">

<h1>Auditorías AR</h1>

<label>Auditor</label>

<select id="auditor">
<option>Diego Nuñez</option>
<option>Sandra Lareu</option>
<option>Nicolas Llacomotti</option>
</select>

<br><br>

<label>Sector</label>
<select id="sector">
<option>Armado de Válvulas</option>
<option>Prearmado</option>
<option>Inyección 1</option>
<option>Inyección 2</option>
<option>Armado de Kosmos</option>
<option>Armado de Pulsadores</option>
<option>Sleeve</option>
<option>Arandelado</option>
<option>Extrusión</option>
<option>Estampado</option>
</select>

<br><br>

<button onclick="comenzarAuditoria()">
Comenzar Auditoría
</button>

<div id="contenido"></div>

</div>

<script>
let hallazgos = 0;
const preguntas = [

"¿Están las condiciones de seguridad contempladas?",
"¿Están cerradas las puertas que dan al exterior?",
"¿Se encuentran las paredes e instalaciones en estado adecuado?",
"¿Están las zonas de tránsito libres de obstrucciones?",

"Respecto a los elementos vinculados a la limpieza: ¿están en un lugar designado?",
"¿Está el área productiva libre de vasos de café, alimentos y pertenencias personales?",
"Si existen productos químicos en el sector, ¿están correctamente identificados?",
"¿Se encuentra el botiquín con los elementos indicados?",
"¿Se evita la presencia de muebles o pallets deteriorados?",
"¿Los carros de mantenimiento se encuentran en buen estado?",

"¿Se verifican acrílicos o vidrios rotos?",
"¿Los elementos cortopunzantes están correctamente ubicados?",
"¿Se evita la acumulación de suciedad y residuos?",
"¿El sector posee correcta iluminación y ausencia de goteras?",

"¿Las máquinas están libres de elementos sueltos?",
"¿Las partes mecánicas y eléctricas tienen protección?",
"¿Las reparaciones temporarias están identificadas?",
"¿Las máquinas están libres de pérdidas contaminantes?",
"¿Se evita consumo innecesario de energía?",
"¿Se evita la caída de materias primas y productos?",

"¿No existen piezas de órdenes previas?",
"¿El sector se encuentra ordenado?",
"¿No existen vidrios o acrílicos rotos en máquinas?",

"¿Los productos están correctamente identificados?",
"¿Se evita la presencia de cajas pre-etiquetadas?",
"¿No existen documentos de producciones anteriores?",
"¿Coinciden las OIP cargadas arriba y abajo?",
"¿Existe coincidencia entre etiquetas y sistema UNIX?",
"¿Los materiales están en sus lugares designados?",
"¿Los materiales están protegidos contra contaminación?",

"¿Los materiales retenidos están segregados e identificados?",
"¿No existen materiales fuera de especificación?",
"¿Los contenedores están limpios y en buen estado?",

"¿El personal utiliza los EPP requeridos?",
"¿La ropa de trabajo está en buen estado?",
"¿El personal evita elementos contaminantes y alimentos en el sector?"

];

let actual = 0;
let cumple = 0;
let noCumple = 0;
let noAplica = 0;
function comenzarAuditoria(){
    actual = 0;
    mostrarPregunta();
}

function mostrarPregunta(){

document.getElementById("contenido").innerHTML = `

<hr>

<h2>Pregunta ${actual + 1} de ${preguntas.length}</h2>

<p>${preguntas[actual]}</p>

<label>
<input type="radio" name="respuesta">
Cumple
</label>

<br><br>

<label>
<input type="radio" name="respuesta">
No Cumple
</label>

<br><br>

<label>
<input type="radio" name="respuesta">
No Aplica
</label>

<br><br>

<textarea placeholder="Observaciones"></textarea>

<br><br>

<label>Evidencia fotográfica</label>

<input type="file" accept="image/*">

<br><br>

<button onclick="siguientePregunta()">
Siguiente
</button>

`;

}

function siguientePregunta(){

const respuesta = document.querySelector(
'input[name="respuesta"]:checked'
);

if(!respuesta){

alert(
'Debe seleccionar una respuesta antes de continuar.'
);

return;

}

const valor = respuesta.parentElement.textContent.trim();

const observacion =
document.querySelector('textarea').value.trim();

const foto =
document.querySelector('input[type="file"]').files.length;

if(
valor === 'No Cumple' &&
(
observacion === '' ||
foto === 0
)
){

alert(
'Para un No Cumple debe cargar observación y evidencia fotográfica.'
);

return;

}
if(valor === 'Cumple'){
    cumple++;
}

if(valor === 'No Cumple'){
    noCumple++;
    hallazgos++;
}

if(valor === 'No Aplica'){
    noAplica++;
}
actual++;

if(actual >= preguntas.length){

const auditor =
document.getElementById("auditor").value;

const sector =
document.getElementById("sector").value;

const porcentaje =
(
(cumple / (cumple + noCumple))
* 100
).toFixed(2);

document.getElementById("contenido").innerHTML = `

<hr>

<h2>Auditoría Finalizada</h2>

<p><b>Auditor:</b> ${auditor}</p>

<p><b>Sector:</b> ${sector}</p>

<p><b>Total de preguntas:</b> ${preguntas.length}</p>

<p><b>Cumple:</b> ${cumple}</p>

<p><b>No Cumple:</b> ${noCumple}</p>

<p><b>No Aplica:</b> ${noAplica}</p>

<p><b>Hallazgos detectados:</b> ${hallazgos}</p>

<div class="kpi">

<div>CUMPLIMIENTO</div>

<div class="kpi-numero">
${porcentaje}%
</div>

</div>

`;
<div style="
background:#dee2e6;
height:25px;
border-radius:15px;
overflow:hidden;
margin-top:15px;
">

<div style="
background:#198754;
width:${porcentaje}%;
height:100%;
">
</div>

</div>
return;

}

mostrarPregunta();

}
</script>

</body>
</html>
