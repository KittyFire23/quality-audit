<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Auditorías AR</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:40px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:600px;
}

select,input,button{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button{
    background:#0d6efd;
    color:white;
    border:none;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="card">

<h1>Auditorías AR</h1>

<label>Auditor</label>

<select>
<option>Diego Nuñez</option>
<option>Sandra Lareu</option>
<option>Nicolas Llacomotti</option>
</select>

<label>Sector</label>

<select>
<option>Armado de Válvulas</option>
<option>Prearmado</option>
<option>Inyección 1</option>
<option>Inyección 2</option>
<option>Armado de Kosmos</option>
<option>Armado de Pulsadores</option>
<option>Sleeve</option>
<option>Arandelado</option>
<option>Extrusión</option>

<button onclick="comenzarAuditoria()">
Comenzar Auditoría
</button>

<div id="contenido"></div>

document.getElementById("contenido").innerHTML = `

<br><br>

</label>

<br><br>

<label>

style="width:100%;height:100px;"
placeholder="Observaciones">
</textarea>

`;
}
</script>

</div>

</body>
</html>
